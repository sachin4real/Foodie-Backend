services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
    depends_on:
      - zookeeper

  orderpayment:
    build:
      context: ./orderpayment
    ports:
      - "8080:8080"
    depends_on:
      - kafka

  restaurantservice:
    build:
      context: ./restaurantservice
    ports:
      - "8081:8081"
    depends_on:
      - kafka

  deliveryservice:
    build:
      context: ./deliveryservice
    ports:
      - "8083:8083"
    depends_on:
      - kafka

  useraccess:
    build:
      context: ./useraccess
    ports:
      - "8084:8084"
    depends_on:
      - kafka
